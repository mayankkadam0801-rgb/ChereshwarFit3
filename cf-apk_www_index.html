<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chereshwar Fit – Nutrition &amp; Health Tracker</title>
<meta name="theme-color" content="#F4A300">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root[data-accent=ocean]{--gold:#2BB5E8}:root[data-accent=forest]{--gold:#5FCB7A}:root[data-accent=berry]{--gold:#FF6FA5}:root[data-accent=violet]{--gold:#A98BFF}
:root{--bg:#ECEEE8;--ink:#151A1F;--card:#fff;--line:#CBD0C8;--mut:#5B6770;--gold:#F4A300;--bad:#C23B33;--ok:#1E7A4C;--p:#3B82C4;--c:#F4A300;--f:#C2563B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161A;--ink:#ECEEE8;--card:#1B2127;--line:#2C353D;--mut:#97A3AC;--bad:#EF6A62;--ok:#4FC68A;--p:#6FB0EA;--f:#E7866C}}
:root[data-theme=dark]{--bg:#12161A;--ink:#ECEEE8;--card:#1B2127;--line:#2C353D;--mut:#97A3AC;--bad:#EF6A62;--ok:#4FC68A;--p:#6FB0EA;--f:#E7866C}
*,::before,::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font-weight:900;font-stretch:62%;font-size:26px;text-transform:uppercase}.logo i{font-style:normal;color:var(--gold)}
h1,h2,h3{font-stretch:62%;text-transform:uppercase;line-height:1;margin:0 0 10px;font-weight:900}
h1{font-size:clamp(48px,13vw,84px)}h2{font-size:34px}h3{font-size:22px;font-stretch:75%}
.mut{color:var(--mut)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 10px 28px -20px rgba(0,0,0,.35)}
.btn{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:8px;padding:11px 18px;background:var(--ink);color:var(--bg)}
.btn.gold{background:var(--gold);color:#151A1F;box-shadow:0 6px 16px -8px var(--gold)}.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.sm{padding:6px 11px;font-size:14px}.btn:disabled{opacity:.45}
.btn.on{background:var(--gold);color:#151A1F;box-shadow:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input.bad{border-color:var(--bad)}input.good{border-color:var(--ok)}
.pw{position:relative}.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:6px 8px}
.msg{font-size:13px;min-height:18px;margin-top:3px}.msg.e{color:var(--bad)}.msg.o{color:var(--ok)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:12px 0}.chk input{width:auto}
.lnk{background:none;border:0;color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
.ringbox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex:0 0 auto}.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:38px;font-stretch:62%;font-weight:900;line-height:1}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
.bar.big{height:16px}
.stat b{display:block;font-size:32px;font-stretch:62%;font-weight:900;line-height:1}.stat span{font-size:13px;color:var(--mut)}
.cups{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.cups span{width:26px;height:34px;border-radius:4px 4px 8px 8px;border:2px solid var(--p);cursor:pointer}.cups span.f{background:var(--p)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600;font-size:13px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line)}
.hero{border-radius:20px;padding:22px;margin-bottom:14px;color:#151A1F;background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--gold) 45%,#fff) 60%,color-mix(in srgb,var(--gold) 15%,#fff));position:relative;overflow:hidden}
.hero svg{position:absolute;right:-10px;bottom:-14px;width:150px;opacity:.35}
.hero h2{margin:0;font-size:40px}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--line);display:grid;place-content:center;font-weight:900;font-size:22px;border:2px solid var(--gold);flex:0 0 auto;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:8px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.tw{display:flex;gap:6px;margin:8px 0}.tw i{flex:1;height:8px;border-radius:6px;background:var(--line)}.tw i.f{background:var(--gold)}
.ch{border-left:6px solid var(--gold)}.big{font-size:44px;font-stretch:62%;font-weight:900;line-height:1}.chips{display:flex;gap:8px;flex-wrap:wrap}.goal{position:relative}.goal::after{content:"";position:absolute;left:0;right:0;bottom:var(--g);border-top:2px dashed var(--mut);opacity:.6}
.hold{position:relative;width:100%;height:64px;border-radius:12px;border:0;background:var(--line);color:var(--ink);font:inherit;font-weight:900;font-size:18px;overflow:hidden;cursor:pointer;touch-action:none;user-select:none}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold)}.hold span{position:relative}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px}
.heat span{aspect-ratio:1;display:grid;place-content:center;border-radius:6px;background:var(--bg)}
.heat .h{background:none;color:var(--mut);aspect-ratio:auto}
.heat .l1{background:color-mix(in srgb,var(--gold) 40%,transparent)}.heat .l2{background:color-mix(in srgb,var(--gold) 70%,transparent)}.heat .l3{background:var(--gold);font-weight:900;color:#151A1F}
.heat .t{box-shadow:inset 0 0 0 2px var(--ink)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;border-bottom:1px solid var(--line)}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;font:inherit;background:none;border:0;padding:10px 0 9px;color:var(--mut);cursor:pointer;font-size:11px;font-weight:600}
nav button b{display:block;font-size:20px}nav button.on{color:var(--ink);box-shadow:inset 0 3px var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%}#toast.on{opacity:1}
details summary{cursor:pointer;font-weight:700;margin-top:12px}
</style></head><body>
<div class="wrap"><div class="top"><div class="logo">Chereshwar<i>.</i>Fit</div><div class="row"><span class="mut" id="who"></span><button class="btn sm ghost" id="pal" aria-label="Change colour">🎨</button><button class="btn sm ghost" id="theme">Theme</button></div></div><div id="app"></div></div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db={users:{}},ses=null,mode='in',tab='home',mem={};
const ld=()=>{try{db=JSON.parse(localStorage.getItem('cf_db'))||db;ses=localStorage.getItem('cf_ses')||sessionStorage.getItem('cf_ses')}catch(e){}};
const sv=()=>{try{localStorage.setItem('cf_db',JSON.stringify(db))}catch(e){toast('Storage full – try smaller photos')}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2200)};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const U=()=>db.users[ses];
const L=(d=today())=>{const u=U();return u.logs[d]||(u.logs[d]={meals:[],water:0,work:[],ci:0,steps:0,ch:0})};
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cf:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+btoa(unescape(encodeURIComponent(s)))}}
const normName=n=>n.trim().replace(/\s+/g,' ').toLowerCase();
const pwLine=p=>p.length>=8&&/[a-z]/i.test(p)&&/\d/.test(p);
const pwBox=(id,lab,ac)=>`<label for="${id}">${lab}</label><div class="pw"><input id="${id}" type="password" autocomplete="${ac}"><button type="button" data-eye="${id}" aria-label="Show or hide password">Show</button></div>`;
function wireEyes(){document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.eye);const s=i.type=='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show'})}

/* ---------- AUTH ---------- */
function auth(){
 $('#who').textContent='';
 $('#app').innerHTML=`<h1>Eat well.<br>Train smart.</h1><p class="mut" style="max-width:46ch">Track meals, calories, water, workouts and weight. Your daily goals are calculated from your body and your goal.</p>
 <div class="g2" style="margin:14px 0"><button class="btn ${mode=='in'?'':'ghost'}" id="a1">Log in</button><button class="btn ${mode=='up'?'':'ghost'}" id="a2">Create account</button></div>
 <div class="card">${mode=='in'?`
  <label for="ph">Phone</label><input id="ph" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10-digit mobile number">
  ${pwBox('pw','Password','current-password')}
  <div class="row sp"><label class="chk"><input type="checkbox" id="rem" checked> Remember me</label><button class="lnk" id="fg">Forgot password?</button></div>
  <div class="msg e" id="err"></div>
  <button class="btn gold" style="width:100%;margin-top:6px" id="go">Log in</button>
  <p class="small mut" style="text-align:center">New here? <button class="lnk" id="sw">Create an account</button></p>`:`
  <label for="nm">Full name</label><input id="nm" autocomplete="name" maxlength="40" placeholder="Letters only, e.g. Chereshwar Patil"><div class="msg" id="nmm"></div>
  <label for="ph">Phone</label><input id="ph" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10-digit mobile number"><div class="msg" id="phm"></div>
  ${pwBox('pw','Password','new-password')}<div class="bar"><i id="str" style="width:0"></i></div><div class="msg" id="pwm">Min 8 characters, with a letter and a number</div>
  ${pwBox('pw2','Confirm password','new-password')}<div class="msg" id="pw2m"></div>
  <div class="g3"><div><label for="age">Age</label><input id="age" type="text" inputmode="numeric" maxlength="2" autocomplete="off"></div><div><label for="ht">Height cm</label><input id="ht" type="text" inputmode="numeric" maxlength="3" autocomplete="off"></div><div><label for="wt">Weight kg</label><input id="wt" type="text" inputmode="decimal" maxlength="5" autocomplete="off"></div></div>
  <div class="g3"><div><label for="sx">Sex</label><select id="sx"><option value="m">Male</option><option value="f">Female</option></select></div>
  <div><label for="ac">Activity</label><select id="ac"><option value="1.2">Low</option><option value="1.375" selected>Light</option><option value="1.55">Moderate</option><option value="1.725">High</option></select></div>
  <div><label for="gl">Goal</label><select id="gl"><option value="-400">Lose fat</option><option value="0" selected>Maintain</option><option value="350">Build muscle</option></select></div></div>
  <div class="msg e" id="err"></div>
  <button class="btn gold" style="width:100%;margin-top:6px" id="go">Create account</button>
  <p class="small mut" style="text-align:center">Already have an account? <button class="lnk" id="sw">Log in</button></p>`}</div>`;
 wireEyes();$('#a1').onclick=()=>{mode='in';auth()};$('#a2').onclick=()=>{mode='up';auth()};$('#sw').onclick=()=>{mode=mode=='in'?'up':'in';auth()};
 const ph=$('#ph');ph.oninput=()=>{ph.value=ph.value.replace(/\D/g,'').slice(0,10);if(mode=='up')chkPh()};
 if(mode=='in'){$('#go').onclick=login;$('#pw').addEventListener('keydown',e=>{if(e.key=='Enter')login()});$('#fg').onclick=forgot}
 else{
  ['age','ht'].forEach(i=>$('#'+i).oninput=e=>{const v=e.target.value.replace(/\D/g,'');if(v!==e.target.value)e.target.value=v});$('#wt').oninput=e=>{const v=e.target.value.replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1');if(v!==e.target.value)e.target.value=v};$('#nm').oninput=chkNm;$('#pw').oninput=chkPw;$('#pw2').oninput=chkPw2;$('#go').onclick=signup}
}
function chkNm(){const i=$('#nm'),v=i.value.replace(/[^A-Za-z ]/g,'');if(v!=i.value)i.value=v;const n=v.trim().replace(/\s+/g,' ');const m=$('#nmm');let ok=false,t='';
 if(n.length<3)t='Enter at least 3 letters';else if(!/^[A-Za-z]+( [A-Za-z]+)*$/.test(n))t='Letters and single spaces only';
 else if(Object.values(db.users).some(u=>normName(u.name)==normName(n)))t='This name is already taken – add your surname or initial';else{ok=true;t='Name is available'}
 m.textContent=t;m.className='msg '+(ok?'o':'e');i.className=n?(ok?'good':'bad'):'';return ok}
function chkPh(){const v=$('#ph').value,m=$('#phm');let ok=false,t='';
 if(v.length<10)t=v.length+'/10 digits';else if(!/^[6-9]/.test(v))t='Mobile numbers start with 6, 7, 8 or 9';else if(db.users[v])t='This number is already registered';else{ok=true;t='Looks good'}
 m.textContent=t;m.className='msg '+(ok?'o':'e');$('#ph').className=v?(ok?'good':'bad'):'';return ok}
function chkPw(){const p=$('#pw').value;let s=0;if(p.length>=8)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;
 const b=$('#str');b.style.width=s*25+'%';b.style.background=['var(--bad)','var(--bad)','var(--gold)','var(--ok)','var(--ok)'][s];
 const ok=pwLine(p);$('#pwm').textContent=ok?['','Weak','Okay','Strong','Very strong'][s]:'Min 8 characters, with a letter and a number';$('#pwm').className='msg '+(ok?'o':'');chkPw2();return ok}
function chkPw2(){const a=$('#pw').value,b=$('#pw2').value,m=$('#pw2m');if(!b){m.textContent='';return false}const ok=a==b;m.textContent=ok?'Passwords match':'Passwords do not match';m.className='msg '+(ok?'o':'e');return ok}
async function signup(){
 const e=$('#err');const n=$('#nm').value.trim().replace(/\s+/g,' ');
 const age=+$('#age').value,ht=+$('#ht').value,wt=+$('#wt').value;
 if(!chkNm())return e.textContent='Please enter a valid, unique full name.';
 if(!chkPh())return e.textContent='Please enter a valid 10-digit phone number.';
 if(!chkPw())return e.textContent='Choose a stronger password.';
 if(!chkPw2())return e.textContent='Passwords do not match.';
 if(!(age>=10&&age<=99&&ht>=100&&ht<=230&&wt>=25&&wt<=250))return e.textContent='Please fill age, height and weight with realistic values.';
 const ph=$('#ph').value;
 db.users[ph]={name:n,pw:await hash($('#pw').value),prof:{age,ht,wt,sx:$('#sx').value,ac:+$('#ac').value,gl:+$('#gl').value},photo:'',logs:{},weights:[{d:today(),w:wt}]};
 ses=ph;try{sessionStorage.setItem('cf_ses',ph);localStorage.setItem('cf_ses',ph)}catch(x){}sv();tab='home';main();toast('Welcome, '+n.split(' ')[0]+'!')}
async function login(){
 const e=$('#err'),ph=$('#ph').value,p=$('#pw').value;
 if(ph.length!=10)return e.textContent='Enter your 10-digit phone number.';
 if(!p)return e.textContent='Enter your password.';
 const u=db.users[ph];if(!u||u.pw!=await hash(p))return e.textContent='Incorrect phone number or password.';
 ses=ph;try{if($('#rem').checked){localStorage.setItem('cf_ses',ph);sessionStorage.removeItem('cf_ses')}else{localStorage.removeItem('cf_ses');sessionStorage.setItem('cf_ses',ph)}}catch(x){}tab='home';main()}
function forgot(){
 $('#app').innerHTML=`<h2>Reset password</h2><div class="card"><label for="ph">Phone</label><input id="ph" inputmode="numeric" maxlength="10">
 <label for="ag">Your age (to verify)</label><input id="ag" type="text" inputmode="numeric" maxlength="2" autocomplete="off">${pwBox('pw','New password','new-password')}<div class="msg e" id="err"></div>
 <div class="g2"><button class="btn ghost" id="bk">Back</button><button class="btn gold" id="go">Reset</button></div></div>`;wireEyes();
 $('#ph').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,10);$('#ag').oninput=e=>{const v=e.target.value.replace(/\D/g,'');if(v!==e.target.value)e.target.value=v};$('#bk').onclick=auth;
 $('#go').onclick=async()=>{const u=db.users[$('#ph').value],e=$('#err');if(!u||u.prof.age!=+$('#ag').value)return e.textContent='Details do not match our records.';
  if(!pwLine($('#pw').value))return e.textContent='Password needs 8+ characters with a letter and a number.';u.pw=await hash($('#pw').value);sv();toast('Password updated – please log in');auth()}}

/* ---------- GOALS ---------- */
function goals(){const p=U().prof,w=U().weights.slice(-1)[0].w;const bmr=10*w+6.25*p.ht-5*p.age+(p.sx=='m'?5:-161);const kcal=Math.round(bmr*p.ac+p.gl);
 const pro=Math.round(w*(p.gl>0?2:1.8)),fat=Math.round(kcal*.25/9),carb=Math.max(0,Math.round((kcal-pro*4-fat*9)/4));return{kcal,pro,fat,carb,cups:Math.ceil(w*35/250),w}}
const sum=(l,k)=>l.meals.reduce((a,m)=>a+(+m[k]||0),0);
function score(d){const l=U().logs[d];if(!l||!l.ci)return 0;const g=goals();let s=1;if(sum(l,'k')>=g.kcal*.8)s++;if(l.water>=g.cups)s++;if(l.work.length||l.ch)s++;return Math.min(3,s)}
function pct(){const l=L(),g=goals();return[['Calories',sum(l,'k'),g.kcal,'kcal','var(--c)'],['Protein',sum(l,'p'),g.pro,'g','var(--p)'],['Water',l.water,g.cups,'cups','#3B82C4'],['Workout',l.work.reduce((a,w)=>a+w.m,0),30,'min','var(--ok)'],['Steps',l.steps||0,10000,'steps','#9B6BFF']]}
function streak(){let n=0,d=new Date();if(!(U().logs[today()]||{}).ci)d.setDate(d.getDate()-1);for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if((U().logs[k]||{}).ci){n++;d.setDate(d.getDate()-1)}else break}return n}


const CH=[['Push-up ladder','Do 10-8-6-4-2 push-ups with 30s rest between sets.',10],['Squat 100','Complete 100 bodyweight squats in as few sets as you can.',12],['Plank hold','Accumulate 5 minutes of plank – any number of sets.',8],['Brisk 30','Walk or jog briskly for 30 minutes without stopping.',30],['Core circuit','3 rounds: 20 crunches, 20 leg raises, 30s side plank each side.',15],['Burpee blast','Do 50 burpees. Break them up however you need.',12],['Stairs & lunges','Climb stairs for 5 min, then 3×15 walking lunges.',15],['Mobility reset','20 minutes of stretching and yoga flow.',20],['Jump rope','10 rounds of 1 minute on, 30 seconds off.',15],['Full-body 20','Squats, push-ups, rows or dips, planks – 4 rounds of 45s each.',20]];
function todayCh(){const d=new Date(),n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);const c=CH[n%CH.length];return{n:c[0],t:c[1],m:c[2]}}
function chDone(){return Object.values(U().logs).filter(l=>l.ch).length}
function chCard(){const c=todayCh(),l=L();return `<div class="card ch"><div class="row sp"><span class="tag">Daily challenge</span><span class="small mut">${chDone()} completed</span></div><h3 style="margin-top:8px">${c.n}</h3><p class="mut" style="margin:0 0 12px">${c.t} · ~${c.m} min</p>${l.ch?'<b style="color:var(--ok)">✓ Done today – nice work!</b>':'<button class="btn gold" id="chd">Mark as complete</button>'}</div>`}
function chWire(r){const b=$('#chd');if(b)b.onclick=()=>{const c=todayCh(),l=L();l.ch=1;l.work.push({n:'Challenge: '+c.n,m:c.m});sv();toast('Challenge complete! 💪');r()}}
let mo={on:0,last:0,n:0};
async function motion(){if(mo.on){removeEventListener('devicemotion',mo.h);mo.on=0;sv();return home()}
 if(!('DeviceMotionEvent' in window))return toast('Motion sensor not available here');
 try{if(DeviceMotionEvent.requestPermission&&await DeviceMotionEvent.requestPermission()!='granted')return toast('Permission denied')}catch(e){return toast('Motion sensor not available here')}
 mo.h=e=>{const a=e.accelerationIncludingGravity;if(!a)return;const m=Math.hypot(a.x||0,a.y||0,a.z||0),t=Date.now();if(m>13&&t-mo.last>350){mo.last=t;const l=L();l.steps=(l.steps||0)+1;const s=$('#stv');if(s)s.textContent=l.steps.toLocaleString();if(++mo.n%15==0)sv()}};
 addEventListener('devicemotion',mo.h);mo.on=1;home();toast('Counting steps – keep this page open')}

 <div class="chips" style="margin-top:12px"><button class="btn sm ghost" data-s="500">+500</button><button class="btn sm ghost" data-s="1000">+1,000</button><button class="btn sm ghost" data-s="2000">+2,000</button><button class="btn sm ghost" id="sm">Set total</button><button class="btn sm ${mo.on?'on':''}" id="sa">${mo.on?'● Auto counting':'Auto count'}</button></div></div>`}

const dk=i=>{const d=new Date();d.setDate(d.getDate()-i);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const wd=i=>{const d=new Date();d.setDate(d.getDate()-i);return 'SMTWTFS'[d.getDay()]};
function chart(vals,goal,col,fmt=x=>x){const mx=Math.max(goal,...vals,1);return `<div class="bars goal" style="--g:${goal/mx*100}%">${vals.map((v,i)=>`<div><span style="font-size:10px">${v?fmt(v):''}</span><i style="height:${v/mx*80}px;background:${col}"></i>${wd(6-i)}</div>`).join('')}</div>`}
function ins(){const u=U(),g=goals(),days=[6,5,4,3,2,1,0].map(i=>dk(i)),Ls=days.map(d=>u.logs[d]||{meals:[],water:0,work:[],steps:0});
 const kc=Ls.map(l=>Math.round(sum(l,'k'))),st=Ls.map(l=>l.steps||0),wt=Ls.map(l=>l.water||0),mn=Ls.map(l=>l.work.reduce((a,w)=>a+w.m,0));
 const logged=kc.filter(x=>x>0),avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;

 const P=Ls.reduce((a,l)=>a+sum(l,'p'),0)*4,C=Ls.reduce((a,l)=>a+sum(l,'c'),0)*4,F=Ls.reduce((a,l)=>a+sum(l,'f'),0)*9,T=P+C+F||1;

 if(Ls.reduce((a,l)=>a+sum(l,'p'),0)/7<g.pro*.8)tips.push('Protein is low – add eggs, dal, paneer, curd or chicken.');if(avg(wt)<g.cups*.7)tips.push('Water is below target on most days – keep a bottle near you.');if(avg(st)<6000)tips.push('Steps are low – a 15-minute walk after meals adds up fast.');if(mn.filter(x=>x>0).length<3)tips.push('Aim for at least 3 active days this week.');
 if(!tips.length)tips.push('Great week – everything is on track. Keep it up!');
 $('#view').innerHTML=`<h2>Insights</h2>
 <div class="g2"><div class="card stat"><b>${avg(logged)||'–'}</b><span>Avg kcal / logged day</span></div><div class="card stat"><b>${avg(st).toLocaleString()}</b><span>Avg steps / day</span></div><div class="card stat"><b>${bmi.toFixed(1)}</b><span>BMI · ${bc}</span></div><div class="card stat"><b>${dw>0?'+':''}${dw.toFixed(1)} kg</b><span>Weight change</span></div></div>
 <div class="card"><div class="row sp"><h3 style="margin:0">Consistency</h3><span class="tag">${cons}%</span></div><p class="small mut" style="margin:6px 0">${ci7} of 7 days checked in</p><div class="tw">${days.map(d=>`<i class="${(u.logs[d]||{}).ci?'f':''}"></i>`).join('')}</div></div>
 <div class="card"><h3>Calories · 7 days</h3>${chart(kc,g.kcal,'var(--gold)')}<p class="small mut" style="margin-bottom:0">Dashed line = daily goal (${g.kcal})</p></div>
 <div class="card"><h3>Steps · 7 days</h3>${chart(st,10000,'#9B6BFF',v=>(v/1000).toFixed(1)+'k')}</div>
 <div class="card"><h3>Active minutes</h3>${chart(mn,30,'var(--ok)')}</div>
 <div class="card"><h3>Water (cups)</h3>${chart(wt,g.cups,'var(--p)')}</div>
 <div class="card"><h3>Macro split · 7 days</h3><div class="bar big" style="display:flex"><i style="width:${P/T*100}%;background:var(--p);border-radius:0"></i><i style="width:${C/T*100}%;background:var(--c);border-radius:0"></i><i style="width:${F/T*100}%;background:var(--f);border-radius:0"></i></div><div class="row small"><span style="color:var(--p)">● Protein ${Math.round(P/T*100)}%</span><span style="color:var(--c)">● Carbs ${Math.round(C/T*100)}%</span><span style="color:var(--f)">● Fat ${Math.round(F/T*100)}%</span></div></div>
 <div class="card"><h3>Smart tips</h3>${tips.map(t=>`<p style="margin:6px 0">💡 ${t}</p>`).join('')}</div>
 <div class="card"><h3>Calculator</h3><div class="g2"><div><label for="cw">Weight kg</label><input id="cw" type="number" value="${g.w}"></div><div><label for="cm">Minutes</label><input id="cm" type="number" value="30"></div></div><label for="cmt">Activity</label><select id="cmt"><option value="3.5">Walking</option><option value="8">Running</option><option value="6">Cycling</option><option value="5">Strength</option><option value="9">HIIT</option><option value="3">Yoga</option></select><p style="margin:12px 0 0">Burn ≈ <b id="cr">0</b> kcal</p></div>`;
 const cr=()=>$('#cr').textContent=Math.round(+$('#cmt').value*(+$('#cw').value||0)*(+$('#cm').value||0)/60);['cw','cm','cmt'].forEach(i=>$('#'+i).oninput=cr);cr()}

function pick(cb,max=480){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(f)};i.click()}

 if(!ses||!U())return auth();

 const T=[['home','🏠','Home'],['meals','🍽','Meals'],['train','💪','Train'],['ins','📊','Insights'],['att','🔥','Check-in'],['me','👤','Me']];
 $('#app').innerHTML=`<div id="view"></div><nav>${T.map(t=>`<button data-t="${t[0]}" class="${tab==t[0]?'on':''}"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav>`;
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;main()});
 ({home,meals,train,ins,att,me})[tab]();
}
function targetBars(){const rows=pct(),avg=Math.round(rows.reduce((a,r)=>a+Math.min(1,r[1]/r[2]),0)/rows.length*100);
 return `<div class="card"><div class="row sp"><h3 style="margin:0">Daily target</h3><span class="tag">${avg}% done</span></div><div class="bar big" style="margin:10px 0 14px"><i style="width:${avg}%;background:var(--gold)"></i></div>
 ${rows.map(r=>`<div class="row sp small"><b>${r[0]}</b><span class="mut">${Math.round(r[1])} / ${r[2]} ${r[3]}</span></div><div class="bar"><i style="width:${Math.min(100,r[1]/r[2]*100)}%;background:${r[4]}"></i></div>`).join('')}</div>`}
function home(){const l=L(),g=goals(),k=sum(l,'k'),R=62,C=2*Math.PI*R,f=Math.min(1,k/g.kcal),h=new Date().getHours();
 $('#view').innerHTML=`<div class="hero"><svg viewBox="0 0 100 100" fill="#151A1F"><circle cx="50" cy="50" r="46" opacity=".25"/><path d="M30 55h40M36 40v30M64 40v30M26 47v16M74 47v16" stroke="#151A1F" stroke-width="7" stroke-linecap="round" fill="none"/></svg>
  <div class="row" style="flex-wrap:nowrap">${avatar()}<div><div class="small" style="font-weight:700">${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}</div><h2>${esc(U().name.split(' ')[0])}</h2></div></div><div style="margin-top:8px;font-weight:600">🔥 ${streak()}-day streak</div></div>
 <div class="card ringbox"><div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--gold)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}"/></svg><div><b>${Math.round(k)}</b><span class="small mut">of ${g.kcal} kcal</span></div></div>
 <div style="flex:1;min-width:180px">${[['Protein',sum(l,'p'),g.pro,'var(--p)'],['Carbs',sum(l,'c'),g.carb,'var(--c)'],['Fat',sum(l,'f'),g.fat,'var(--f)']].map(m=>`<div class="row sp small"><b>${m[0]}</b><span class="mut">${Math.round(m[1])} / ${m[2]} g</span></div><div class="bar"><i style="width:${Math.min(100,m[1]/m[2]*100)}%;background:${m[3]}"></i></div>`).join('')}</div></div>
 ${targetBars()}${chCard()}${stepCard()}
 <div class="card"><div class="row sp"><h3 style="margin:0">Water</h3><span class="mut small">${l.water} / ${g.cups} cups</span></div><div class="cups">${Array.from({length:g.cups},(_,i)=>`<span data-c="${i}" class="${i<l.water?'f':''}"></span>`).join('')}</div><div class="g2"><button class="btn ghost sm" id="w-">− Cup</button><button class="btn sm" id="w+">+ Cup</button></div></div>`;
 document.querySelectorAll('.cups span').forEach(s=>s.onclick=()=>{l.water=+s.dataset.c+1==l.water?l.water-1:+s.dataset.c+1;sv();home()});

function meals(){const l=L();

 ${l.meals.some(m=>m.ph)?`<div class="card"><h3>Food diary</h3><div class="photos">${l.meals.filter(m=>m.ph).map(m=>`<img src="${m.ph}" alt="${esc(m.n)}">`).join('')}</div></div>`:''}`;

function att(){const l=L(),now=new Date(),y=now.getFullYear(),mo=now.getMonth(),first=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate();
 const key=d=>y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');let days=0,pts=0;for(let d=1;d<=dim;d++){const s=score(key(d));if(s){days++;pts+=s}}
 $('#view').innerHTML=`<h2>Check-in</h2><div class="card"><p class="mut" style="margin-top:0">Press and hold the button for one second to check in. Your day then lights up brighter the more targets you hit – calories, water and a workout.</p>
